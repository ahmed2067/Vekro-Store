<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111c32"><title>إدارة VEKRO STORE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#19304f;font-family:Tahoma,Arial,sans-serif}header{background:#111c32;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}header b{font-size:22px;letter-spacing:1px}main{max-width:1100px;margin:26px auto;padding:0 16px}.panel{background:white;border:1px solid #e1e9f3;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #1028490b}h2{margin-top:0}input,select{padding:12px;border:1px solid #d4dfec;border-radius:10px;font:inherit;width:100%;margin:6px 0}button{border:0;background:#2878df;color:white;border-radius:10px;padding:11px 16px;font-weight:bold;cursor:pointer;margin:4px}button.secondary{background:#e6eef8;color:#24476e}button.danger{background:#b83a4b}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.hidden{display:none}.notice{padding:12px;border-radius:10px;background:#e8f5ff;margin:12px 0;display:none}.order{border:1px solid #e5edf6;border-radius:12px;padding:14px;margin:10px 0}.muted{color:#718198;font-size:13px}.tag{display:inline-block;background:#edf4fd;padding:5px 9px;border-radius:20px;font-size:12px}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style></head><body><header><b>VEKRO <span style="color:#40c4ff">ADMIN</span></b><a href="/" style="color:#dbeafe">العودة للمتجر</a></header>
<main><div id="notice" class="notice"></div>
<section id="login" class="panel"><h2>تسجيل دخول المدير</h2><p class="muted">بيانات الدخول تُضبط في إعدادات الاستضافة ولا تُكتب داخل ملفات الموقع.</p><form id="loginForm"><input name="email" type="email" placeholder="البريد الإلكتروني للمدير" required><input name="password" type="password" placeholder="كلمة المرور" required><button>دخول آمن</button></form></section>
<div id="dashboard" class="hidden">
<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>لوحة التحكم</h2><button class="secondary" id="logout">تسجيل الخروج</button></div><p class="muted">المنتجات التي تضيفها هنا تُحفظ محليًا. منتجات Safka المستوردة تُدار من حساب Safka.</p></section>
<section class="panel"><h2>إضافة منتج محلي</h2><form id="productForm"><div class="row"><input name="name" placeholder="اسم المنتج" required><input name="price" type="number" min="0" step="0.01" placeholder="السعر بالجنيه" required><input name="category" placeholder="التصنيف"></div><input name="image" type="url" placeholder="رابط صورة المنتج (اختياري)"><button>إضافة المنتج</button></form><div id="products"></div></section>
<section class="panel"><h2>طلبات العملاء</h2><button class="secondary" id="refresh">تحديث الطلبات</button><div id="orders"></div></section>
</div></main>
<script>
const $=id=>document.getElementById(id);
function note(t){$("notice").textContent=t;$("notice").style.display="block"}
async function api(url,options={}){const r=await fetch(url,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"حدث خطأ في الاتصال.");return d}
async function showDashboard(){ $("login").classList.add("hidden");$("dashboard").classList.remove("hidden");await Promise.all([loadOrders(),loadProducts()])}
$("loginForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({email:f.get("email"),password:f.get("password")})});await showDashboard();note("تم تسجيل الدخول.")}catch(x){note(x.message)}};
async function loadOrders(){try{const orders=await api("/api/admin/orders");$("orders").innerHTML=orders.length?orders.slice().reverse().map(o=>'<article class="order"><b>'+esc(o.id)+'</b> <span class="tag">'+esc(o.status)+'</span><p>'+esc(o.customer?.name)+' — '+esc(o.customer?.phone)+'</p><p class="muted">'+esc(o.customer?.address)+'</p><p>'+((o.items||[]).map(i=>esc(i.name)+' × '+Number(i.quantity||1)).join("، "))+'</p><label>تغيير الحالة</label><select data-status="'+esc(o.id)+'">'+[['pending_confirmation','بانتظار التأكيد'],['confirmed','تم التأكيد'],['processing','قيد التجهيز'],['shipped','تم الشحن'],['delivered','تم التسليم'],['cancelled','ملغي']].map(([v,t])=>'<option value="'+v+'" '+(o.status===v?'selected':'')+'>'+t+'</option>').join("")+'</select><button data-save="'+esc(o.id)+'">حفظ الحالة</button></article>').join(""):'<p class="muted">لا توجد طلبات حتى الآن.</p>';
$("orders").querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{try{const id=b.dataset.save,status=$("orders").querySelector('[data-status="'+CSS.escape(id)+'"]').value;await api("/api/admin/orders/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status})});note("تم تحديث حالة الطلب.");await loadOrders()}catch(e){note(e.message)}})}catch(e){note(e.message)}}
async function loadProducts(){try{const p=await api("/api/admin/products");$("products").innerHTML=p.length?p.map(x=>'<div class="order">'+esc(x.name)+' — '+Number(x.price).toLocaleString("ar-EG")+' ج.م <button class="danger" data-delete="'+esc(x.id)+'">حذف</button></div>').join(""):'<p class="muted">لا توجد منتجات محلية.</p>';$("products").querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{if(!confirm("حذف هذا المنتج؟"))return;try{await api("/api/admin/products/"+encodeURIComponent(b.dataset.delete),{method:"DELETE"});await loadProducts();note("تم حذف المنتج.")}catch(e){note(e.message)}})}catch(e){note(e.message)}}
$("productForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api("/api/admin/products",{method:"POST",body:JSON.stringify({name:f.get("name"),price:f.get("price"),category:f.get("category"),image:f.get("image")})});e.target.reset();await loadProducts();note("تمت إضافة المنتج.")}catch(x){note(x.message)}};
$("refresh").onclick=loadOrders;
$("logout").onclick=async()=>{try{await api("/api/admin/logout",{method:"POST"});location.reload()}catch(e){note(e.message)}};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></body></html>
